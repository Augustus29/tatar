name: Build

# Dakika harcamamak için otomatik çalışmaz: GitHub'da Actions → Build → "Run workflow"
# ile elle başlatılır (ya da v* sürüm etiketi gönderilince).
# Üçüncü taraf eylemler tam commit SHA'sı ile sabitlenmiştir (sondaki yorum sürüm etiketidir).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platform:
        description: "Hangi platform derlensin? (macOS dakikaları 10 kat sayılır)"
        type: choice
        default: windows
        options: [windows, macos, both]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Kontrol (macOS)
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'windows'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (dal)
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target

      - name: npm ci
        run: npm ci

      - name: Tür denetimi (typecheck)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Biçim denetimi (format:check)
        run: npm run format:check

      - name: Frontend derlemesi (Tauri build script için dist gerekir)
        run: npm run build

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

  build-macos:
    name: Derle (macOS)
    needs: check
    # 'check' atlansa da (yalnızca Windows seçilince) çalışır, başarısız olursa çalışmaz.
    if: ${{ !cancelled() && !failure() && (github.event_name != 'workflow_dispatch' || inputs.platform == 'both' || inputs.platform == 'macos') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Rust (macOS evrensel ikili için her iki hedef)
        if: runner.os == 'macOS'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (dal)
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
      - name: npm ci
        run: npm ci
      - name: Tauri derle (macOS evrensel)
        if: runner.os == 'macOS'
        run: npx tauri build --target universal-apple-darwin --bundles app,dmg
      - name: macOS - .app dosyasını ziple
        if: runner.os == 'macOS'
        run: |
          mkdir -p staging
          ditto -c -k --sequesterRsrc --keepParent \
            src-tauri/target/universal-apple-darwin/release/bundle/macos/Tatar.app \
            staging/Tatar.app.zip
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg staging/
      - name: Upload - macOS
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Tatar-macos
          path: staging/*
          if-no-files-found: error

  build-windows:
    name: Derle (Windows)
    needs: check
    # 'check' atlansa da (yalnızca Windows seçilince) çalışır, başarısız olursa çalışmaz.
    if: ${{ !cancelled() && !failure() && (github.event_name != 'workflow_dispatch' || inputs.platform == 'both' || inputs.platform == 'windows') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Rust (Windows)
        if: runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (dal)
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
      - name: npm ci
        run: npm ci
      - name: Windows - frontend derlemesi
        if: runner.os == 'Windows'
        run: npm run build
      - name: Windows - cargo clippy
        if: runner.os == 'Windows'
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Windows - cargo test
        if: runner.os == 'Windows'
        working-directory: src-tauri
        run: cargo test
      - name: Tauri derle (Windows)
        if: runner.os == 'Windows'
        run: npx tauri build --bundles msi,nsis
      - name: Upload - Windows
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Tatar-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  release:
    name: Sürüm sayfası
    # Yalnızca v* etiketi gönderilince: iki derlemenin dosyalarıyla GitHub sürümü oluşturur.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist-release
          merge-multiple: true

      # İndirenin dosyanın bozulmadığını doğrulayabilmesi için SHA-256 özeti (Linux runner: sha256sum).
      - name: SHA256SUMS oluştur
        working-directory: dist-release
        run: |
          find . -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.msi' -o -name '*-setup.exe' \) -print0 \
            | xargs -0 -r sha256sum \
            | sed -E 's#  \./([^/]*/)*#  #' > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: Tatar ${{ github.ref_name }}
          body_path: .github/release/${{ github.ref_name }}.md
          # Windows dosyaları msi/ ve nsis/ alt klasörlerinde iner.
          files: |
            dist-release/**/*.dmg
            dist-release/**/*.zip
            dist-release/**/*.msi
            dist-release/**/*-setup.exe
            dist-release/SHA256SUMS
          fail_on_unmatched_files: true
